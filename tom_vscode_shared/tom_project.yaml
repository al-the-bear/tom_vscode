project_id: VSS
name: vs-shared
description: >-
  Shared components for the Tom VS Code extensions
license: BSD-3-Clause

# A TypeScript library whose build script is `compile`, the VS Code
# convention its extensions follow; the workspace build action runs
# `npm run build` for TypeScript packages.
actions:
  build:
    default:
      commands:
        - npm run compile
