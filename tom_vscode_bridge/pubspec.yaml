name: tom_vscode_bridge
description: D4rt bridge server for VS Code extension integration.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.4

# Add regular dependencies here.
dependencies:
  path: ^1.9.0
  tom_vscode_scripting_api: ^2.0.1
  # The generated scripting-API bridges import the todo model directly.
  tom_todo_model: ^1.1.0   # the regenerated bridges use TomTodo.userAction (1.1.0)
  # 1.225.0: `D4rt.loadedSourceModuleCount`, which tom_d4rt_dcli 1.8.0's bridges
  # call although that package still declares `tom_d4rt: ^1.77.0`. A lock frozen
  # below it compiles nothing (seen on legiondary01, 2026-10-27).
  tom_d4rt: ">=1.225.0"
  tom_d4rt_dcli: ">=1.8.0"

dev_dependencies:
  # A DEV dependency, so it changes nothing this package ships. It is here so
  # `dart run tom_d4rt_generator:d4rtgen` works and `bridges_fresh_test.dart`
  # can run: without it this package configured d4rtgen in buildkit.yaml while
  # being unable to regenerate its bridges or check what it had committed
  # (SCE3).
  tom_d4rt_generator: ">=1.51.0"
  lints: ^6.0.0
  test: ^1.25.6
  build_runner: ^2.10.4
  build: ^4.0.3

