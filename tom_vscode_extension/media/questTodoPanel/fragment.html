<!-- Quest TODO panel HTML fragment — extracted from getQuestTodoHtmlFragment()
     in src/handlers/questTodo/questTodoAssets.ts (Phase B.5 webview
     restructuring). Composed into the popout, embedded, and accordion shells;
     loaded raw via readMediaText(). -->
<div class="qt-session-switch" id="qt-session-switch" style="display:none" title="The session whose todos are shown"></div>
<div class="qt-top-bar">
    <label>Quest:</label>
    <select id="qt-quest-select"></select>
    <label>File:</label>
    <select id="qt-file-select"><option value="all">All files</option></select>
    <span id="qt-fixed-file-label" class="qt-scope-summary" style="display:none;"></span>
    <!-- The quest scope (vscimpb137): which quests and files the panel shows; main.js shows it in the quest todo views. -->
    <span class="qt-scope-controls" id="qt-scope-controls" style="display:none;">
        <button type="button" class="qt-template-btn qt-scope-btn" id="qt-scope-btn" title="The quests the panel shows — click to pick one quest, the open windows' quests or all quests"><span class="codicon codicon-library"></span><span class="qt-scope-name"></span></button>
        <button type="button" class="icon-btn qt-toggle-btn pressed" id="qt-files-live" data-qt-files="live" aria-pressed="true" aria-label="Live todos"><span class="codicon codicon-checklist"></span></button>
        <button type="button" class="icon-btn qt-toggle-btn" id="qt-files-archived" data-qt-files="archived" aria-pressed="false" aria-label="Archived todos"><span class="codicon codicon-archive"></span></button>
        <button type="button" class="icon-btn qt-toggle-btn" id="qt-files-deleted" data-qt-files="deleted" aria-pressed="false" aria-label="Deleted todos"><span class="codicon codicon-trash"></span></button>
        <select id="qt-quest-order" class="qt-quest-order" title="How the todos of several quests are arranged" style="display:none;">
            <option value="combined">Groups of all quests</option>
            <option value="quest-groups">By quest, then groups</option>
            <option value="quest-list">By quest, then list</option>
        </select>
        <button type="button" class="icon-btn qt-toggle-btn" id="qt-quest-prefix" aria-pressed="false" aria-label="Quest in front of todo ids"><span class="codicon codicon-symbol-namespace"></span></button>
    </span>
    <span class="qt-search-wrap"><input id="qt-search" type="text" placeholder="Search..." class="qt-search-input"><button type="button" class="qt-search-clear" id="qt-search-clear" title="Clear the search" aria-label="Clear the search" hidden><span class="codicon codicon-close"></span></button></span>
    <button class="icon-btn" id="qt-btn-filter" title="Filter"><span class="codicon codicon-filter"></span></button>
    <button class="icon-btn" id="qt-btn-sort" title="Sort"><span class="codicon codicon-list-ordered"></span></button>
    <button class="icon-btn" id="qt-btn-only-mine" title="Show only your own todos (user action) / show all todos"><span class="codicon codicon-person"></span></button>
    <button class="icon-btn" id="qt-btn-group-members" aria-pressed="false" title="Group todo members: shown — click to hide them below their group todos"><span class="codicon codicon-eye"></span></button>
    <button class="icon-btn" id="qt-btn-expand-all" title="Expand all prefix groups"><span class="codicon codicon-expand-all"></span></button>
    <button class="icon-btn" id="qt-btn-collapse-all" title="Collapse all prefix groups"><span class="codicon codicon-collapse-all"></span></button>
    <button class="icon-btn" id="qt-btn-nav-back" title="Back" disabled style="opacity:0.3"><span class="codicon codicon-arrow-left"></span></button>
    <button class="icon-btn" id="qt-btn-nav-fwd" title="Forward" disabled style="opacity:0.3"><span class="codicon codicon-arrow-right"></span></button>
    <button class="icon-btn" id="qt-btn-reload" title="Reload from disk"><span class="codicon codicon-refresh"></span></button>
    <button class="icon-btn" id="qt-btn-dep-cleanup" title="Clean up the todo dependencies: asks which todos (the ones shown, the open windows' quests, all quests); blockers that are done or no longer exist leave blocked_by, todos nothing blocks any more are unblocked, blocking is set from the others' blocked_by"><span class="codicon codicon-references"></span></button>
    <button class="icon-btn" id="qt-btn-open-yaml" title="Open YAML"><span class="codicon codicon-go-to-file"></span></button>
    <button class="icon-btn" id="qt-btn-delete-all" title="Delete all session todos" style="display:none"><span class="codicon codicon-trash"></span></button>
    <button class="icon-btn" id="qt-btn-open-ext" title="Open in external application" style="display:none"><span class="codicon codicon-terminal"></span></button>
    <button class="icon-btn" id="qt-btn-import" title="Import todos from file" style="display:none"><span class="codicon codicon-cloud-download"></span></button>
    <button class="icon-btn" id="qt-btn-popout" title="Open in editor area"><span class="codicon codicon-link-external"></span></button>
    <button class="primary" id="qt-btn-add-todo" title="Add Todo"><span class="codicon codicon-add"></span> Add</button>
    <button class="icon-btn" id="qt-btn-mass-add" title="Mass Add Todos"><span class="codicon codicon-list-unordered"></span></button>
    <button class="icon-btn" id="qt-btn-clear-stack" title="Clear todo stack (empty)" disabled style="opacity:0.4"><span class="codicon codicon-clear-all"></span></button>
    <button class="icon-btn" id="qt-btn-archive" title="Archive completed todo" style="display:none"><span class="codicon codicon-archive"></span></button>
    <button class="icon-btn" id="qt-btn-archive-all" title="Archive all completed todos" style="display:none"><span class="codicon codicon-archive"></span><span class="codicon codicon-check-all"></span></button>
    <button class="icon-btn" id="qt-btn-delete-file" title="Delete todo (move to -deleted file)" style="display:none"><span class="codicon codicon-trash"></span></button>
    <button class="icon-btn" id="qt-btn-delete-cancelled" title="Delete all cancelled todos" style="display:none"><span class="codicon codicon-trash"></span><span class="codicon codicon-circle-slash"></span></button>
    <button class="icon-btn" id="qt-btn-complete" title="Mark selected todo completed" style="display:none"><span class="codicon codicon-check"></span></button>
    <button class="icon-btn" id="qt-btn-cancel" title="Mark selected todo cancelled" style="display:none"><span class="codicon codicon-circle-slash"></span></button>
    <button class="icon-btn" id="qt-btn-reopen-sel" title="Mark selected todo not-started" style="display:none"><span class="codicon codicon-issue-reopened"></span></button>
    <button class="icon-btn" id="qt-btn-move-file" title="Move selected todo(s) to another todo file" style="display:none"><span class="codicon codicon-file-symlink-file"></span></button>
    <span class="qt-spacer"></span>
    <div class="qt-top-chat-group">
        <!-- Done notification: an icon toggle (aria-pressed); main.js sets its tooltip from its state. -->
        <button type="button" class="icon-btn qt-toggle-btn" id="qt-done-notification" aria-pressed="false" aria-label="Done notification" disabled><span class="codicon codicon-bell-slash"></span></button>
        <!-- The template: a button showing the selection (at most 20 characters); a click opens the picker.
             The hidden select holds the templates offered and the selection, as before. -->
        <button type="button" class="qt-template-btn" id="qt-template-btn" title="Template: (None) — click to pick another"><span class="codicon codicon-file-code"></span><span class="qt-template-name">(None)</span></button>
        <select id="qt-template-select" hidden aria-hidden="true"><option value="__none__">(None)</option></select>
        <!-- The Next toggle (queue next / at the end; every queue button follows it) and the Fresh toggle (a
             one-prompt session based on the one picked); main.js sets icon and tooltip from their state. The same
             pair leads a todo's Run row. -->
        <button type="button" class="icon-btn qt-toggle-btn qt-next-toggle" data-qt-queue-toggle="next" aria-pressed="false" aria-label="Queue next"><span class="codicon codicon-list-ordered"></span></button><button type="button" class="icon-btn qt-toggle-btn qt-fresh-toggle" data-qt-queue-toggle="fresh" aria-pressed="false" aria-label="Fresh session"><span class="codicon codicon-sparkle"></span></button>
        <!-- The default queue button (the default run, default@default) comes first; the next one asks quest, run
             and session. -->
        <button class="icon-btn" id="qt-btn-add-queue-default" title="Save to Queue in the default run (default@default) — the stacked todos, else the selected one; next or at the end as the Next toggle says"><span class="codicon codicon-add"></span><span class="codicon codicon-list-ordered"></span></button>
        <button class="icon-btn" id="qt-btn-add-queue" title="Save to Queue — asks the quest, run and session; next or at the end as the Next toggle says"><span class="codicon codicon-account"></span><span class="codicon codicon-list-ordered"></span></button>
        <button class="icon-btn primary" id="qt-btn-send-chat" title="Send to chat"><span class="codicon codicon-send"></span></button>
    </div>
</div>
<div class="qt-split" style="position:relative;">
    <div class="qt-list-pane" id="qt-list-pane"></div>
    <div class="qt-splitter" id="qt-splitter" title="Drag to resize"></div>
    <div class="qt-detail-pane" id="qt-detail-pane"><div class="qt-empty-detail">Select a todo to view details</div></div>
    <div id="qt-filter-picker" class="qt-picker-overlay" style="display:none;"></div>
    <div id="qt-sort-picker" class="qt-picker-overlay qt-sort-picker-overlay" style="display:none;"></div>
</div>
<div class="qt-popup-overlay" id="qt-popup-overlay">
    <div class="qt-popup" id="qt-popup-content"></div>
</div>
<div class="qt-mass-overlay" id="qt-mass-overlay">
    <div class="qt-mass-panel" id="qt-mass-panel"></div>
</div>
