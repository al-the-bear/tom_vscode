<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<!--
  Role Editor (vscimpb87, gsel7; src/handlers/rolesEditor-handler.ts). One
  page, two tabs: Roles and Role Types (window.__INIT__.kind: the tab it opens
  on). Every interaction is wired with addEventListener, so the loader's
  default nonce-only CSP applies. Data arrives by postMessage after 'ready'.
  Each role and role type has the guideline picker (media/shared/aspectPicker.js).
-->
<link rel="stylesheet" href="{{sharedUri}}/aspectPicker.css">
<link rel="stylesheet" href="{{baseUri}}/style.css">
</head>
<body>
<h2 id="headline">Role Editor</h2>
<div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" id="tabRoles" data-kind="roles">Roles</button>
    <button type="button" class="tab" role="tab" id="tabRoleTypes" data-kind="roleTypes">Role Types</button>
</div>
<p id="intro" class="muted"></p>
<div class="layout">
    <div class="list-pane">
        <div class="action-bar">
            <button class="icon-btn" id="btnAdd" title="Add"><span class="codicon codicon-add"></span></button>
            <button class="icon-btn" id="btnDelete" title="Delete the selected role type (only when no role names it)"><span class="codicon codicon-trash"></span></button>
            <button class="icon-btn" id="btnRefresh" title="Read the files again"><span class="codicon codicon-refresh"></span></button>
            <button class="icon-btn" id="btnMoveUp" title="Move the selected entry up in the list"><span class="codicon codicon-arrow-up"></span></button>
            <button class="icon-btn" id="btnMoveDown" title="Move the selected entry down in the list"><span class="codicon codicon-arrow-down"></span></button>
        </div>
        <ul id="itemList" class="item-list" role="listbox"></ul>
    </div>
    <div class="form-pane" id="form"></div>
</div>
<script src="{{sharedUri}}/aspectPicker.js"></script>
<script src="{{baseUri}}/main.js"></script>
</body>
</html>
