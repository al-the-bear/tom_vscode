<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      Markdown Browser shell — extracted from buildHtml() in
      src/handlers/markdownBrowser-handler.ts (Phase B.21 webview restructuring).

      This panel COMPOSES the shared documentPicker fragment (HTML/CSS/JS) — a
      component owned elsewhere and consumed by other panels too — so it is built
      with the readMediaText escape hatch rather than loadWebviewHtml: buildHtml
      reads this file and substitutes the {{tokens}} below (cspSource, the
      marked/mermaid/codicons webview URIs, baseUri, and the picker pieces).

      The CSP is hand-written and uses 'unsafe-inline' (no nonce-source, so it is
      honored): it admits the external marked/mermaid bundles + main.js (all
      served from cspSource) and the inlined picker <style>/<script>. main.js
      acquires the vscode API once and publishes window.vscode; the picker IIFE
      (a separate inline <script>) reads that global.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'unsafe-inline'; font-src {{cspSource}}; img-src {{cspSource}} data: https:;">
    <link href="{{codiconsUri}}" rel="stylesheet" />
    <link href="{{baseUri}}/style.css" rel="stylesheet" />
    <style>
{{pickerCss}}
    </style>
</head>
<body>
    <!-- Action Bar -->
    <div class="action-bar">
        <div class="picker-area">
            {{pickerHtml}}
        </div>
        <div class="nav-area">
            <button class="icon-btn" id="openInEditorBtn" title="Open in Editor">
                <span class="codicon codicon-go-to-file"></span>
            </button>
            <button class="icon-btn" id="openExternalBtn" title="Open in External Viewer">
                <span class="codicon codicon-link-external"></span>
            </button>
            <span style="width:1px; height:16px; background:var(--vscode-panel-border); margin:0 2px;"></span>
            <button class="icon-btn" id="backBtn" disabled title="Go Back">
                <span class="codicon codicon-arrow-left"></span>
            </button>
            <button class="icon-btn" id="forwardBtn" disabled title="Go Forward">
                <span class="codicon codicon-arrow-right"></span>
            </button>
            <span style="width:1px; height:16px; background:var(--vscode-panel-border); margin:0 2px;"></span>
            <button class="icon-btn" id="reloadBtn" title="Reload Current File">
                <span class="codicon codicon-refresh"></span>
            </button>
            <button class="icon-btn" id="reconnectBtn" title="Reconnect live watch (re-attach auto-update to the file)">
                <span class="codicon codicon-plug"></span>
            </button>
            <span style="width:1px; height:16px; background:var(--vscode-panel-border); margin:0 2px;"></span>
            <button class="toggle-btn" id="fullIdBtn" title="Show each heading's full (dotted) ID underneath it">Full ID</button>
            <button class="toggle-btn" id="crlfBtn" title="Convert escaped / literal line-break characters into real newlines">CR/LF</button>
            <span style="width:1px; height:16px; background:var(--vscode-panel-border); margin:0 2px;"></span>
            <button class="icon-btn" id="editModeBtn" title="Edit mode: edit or extend paragraphs in place">
                <span class="codicon codicon-edit"></span>
            </button>
            <span style="width:1px; height:16px; background:var(--vscode-panel-border); margin:0 2px;"></span>
            <button class="icon-btn" id="foldAllBtn" title="Fold all sections">
                <span class="codicon codicon-collapse-all"></span>
            </button>
            <select id="foldLevelSelect" class="fold-level-select" title="Heading level to fold or unfold"></select>
            <button class="icon-btn" id="foldLevelBtn" title="Fold all headings of the selected level">
                <span class="codicon codicon-fold"></span>
            </button>
            <span style="width:1px; height:16px; background:var(--vscode-panel-border); margin:0 2px;"></span>
            <button class="icon-btn" id="indentBtn" title="Indent headings and their sections by heading level">
                <span class="codicon codicon-indent"></span>
            </button>
            <select id="indentSizeSelect" class="fold-level-select" title="Spaces of indentation per heading level">
                <option value="1">1 sp</option>
                <option value="2" selected>2 sp</option>
                <option value="3">3 sp</option>
                <option value="4">4 sp</option>
                <option value="6">6 sp</option>
                <option value="8">8 sp</option>
            </select>
            <span style="width:1px; height:16px; background:var(--vscode-panel-border); margin:0 2px;"></span>
            <button class="icon-btn" id="navPrevBtn" title="Previous (of the kinds chosen beside)">
                <span class="codicon codicon-arrow-up"></span>
            </button>
            <span class="nav-kind">
                <button class="nav-kind-btn" id="navKindBtn" title="What the arrows step through — tick one kind or several">Unanswered</button>
                <div class="nav-kind-pop" id="navKindPop" hidden>
                    <label><input type="checkbox" data-nav-kind="changes"> Changes</label>
                    <label><input type="checkbox" data-nav-kind="comments"> Comments</label>
                    <label><input type="checkbox" data-nav-kind="inline"> Inline comments</label>
                    <label><input type="checkbox" data-nav-kind="questions"> Questions</label>
                    <label><input type="checkbox" data-nav-kind="unanswered" checked> Unanswered</label>
                </div>
            </span>
            <button class="icon-btn" id="navNextBtn" title="Next (of the kinds chosen beside)">
                <span class="codicon codicon-arrow-down"></span>
            </button>
            <span id="navCount" class="search-count" title="Current / targets of the kinds chosen"></span>
            <button class="icon-btn" id="acceptAllBtn" title="Accept every change in the document">
                <span class="codicon codicon-check-all"></span>
            </button>
            <button class="icon-btn" id="rejectAllBtn" title="Reject every change in the document">
                <span class="codicon codicon-discard"></span>
            </button>
        </div>
    </div>

    <!-- File info -->
    <div class="file-info-bar">
        <span class="file-path" id="filePath">No file selected</span>
        <span class="line-pos" id="linePos" title="Line at the top of the view / lines in the document"></span>
        <button class="icon-btn" id="docBackBtn" disabled title="Back to where you were in this document">
            <span class="codicon codicon-chevron-left"></span>
        </button>
        <button class="icon-btn" id="docForwardBtn" disabled title="Forward within this document">
            <span class="codicon codicon-chevron-right"></span>
        </button>
        <span class="search-box">
            <input id="searchInput" class="search-input" type="search" placeholder="Search in document" title="Search in this document (Enter: next, Shift+Enter: previous, Esc: clear)" />
            <button class="search-clear" id="searchClearBtn" title="Clear search">
                <span class="codicon codicon-close"></span>
            </button>
        </span>
        <span id="searchCount" class="search-count"></span>
        <button class="icon-btn" id="searchPrevBtn" disabled title="Previous match (Shift+Enter)">
            <span class="codicon codicon-arrow-up"></span>
        </button>
        <button class="icon-btn" id="searchNextBtn" disabled title="Next match (Enter)">
            <span class="codicon codicon-arrow-down"></span>
        </button>
    </div>

    <!-- Content -->
    <div class="content-area markdown-body" id="contentArea">
        <div class="empty-state">
            <span class="codicon codicon-markdown"></span>
            <div>Select a document to preview</div>
        </div>
    </div>

    <!-- Shown while a change to the document is being saved: nothing can be clicked or typed meanwhile. -->
    <div id="busyOverlay" class="busy-overlay" hidden>
        <span class="busy-pill"><span class="codicon codicon-loading codicon-modifier-spin"></span> <span id="busyText">Saving…</span></span>
    </div>

    <script src="{{markedUri}}"></script>
    <script src="{{mermaidUri}}"></script>
    <script src="{{baseUri}}/blocks.js"></script>
    <script src="{{baseUri}}/main.js"></script>
    <script>
{{pickerScript}}
    </script>
</body>
</html>
