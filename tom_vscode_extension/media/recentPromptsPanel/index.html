<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<!--
  Recent Prompts (src/handlers/recentPromptsPanel-handler.ts): the last prompts
  the prompt queue sent in this window's quest, one row per item, newest first;
  an item expands into its iterations and single prompts. Read-only.
  No inline handlers: main.js attaches every listener, so the loader's
  nonce-only CSP applies. Codicons are loaded by main.js from window.__INIT__;
  the Markdown overlay is the shared one (media/shared/mdOverlay.js).
-->
<link rel="stylesheet" href="{{sharedUri}}/mdOverlay.css">
<link rel="stylesheet" href="{{baseUri}}/style.css">
</head>
<body>
<div id="bar" class="bar"></div>
<div id="rows" class="rows"><div class="muted">Loading…</div></div>
<script src="{{sharedUri}}/mdOverlay.js"></script>
<script src="{{baseUri}}/main.js"></script>
</body>
</html>
