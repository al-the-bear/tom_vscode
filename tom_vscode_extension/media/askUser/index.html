<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<!--
  The user-input panel (src/handlers/userInteractionPanel.ts, vscimpb81): every
  interaction that waits for the user — questions (tomAi_askUser), tool
  approvals, plan proposals, pickers, asks in the MD Browser — one tab per
  process run with open interactions, each run's interactions as cards.

  All interactions are wired with addEventListener (no inline on*= handlers),
  so the loader's default nonce-only CSP applies. The open interactions arrive
  via window.__INIT__ (first paint) and then as { type: 'state' } messages.
-->
<link rel="stylesheet" href="{{baseUri}}/style.css">
</head>
<body>

<div class="ask-wrap">
    <div id="runTabs" class="run-tabs" role="tablist"></div>
    <div id="interactions" class="interactions"></div>
    <p id="emptyNote" class="ask-hint" hidden>Nothing is waiting for your answer.</p>
</div>

<script src="{{baseUri}}/main.js"></script>
</body>
</html>
