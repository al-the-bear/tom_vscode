<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<!--
  Prompt Queue Editor shell — extracted from getHtml() in
  src/handlers/queueEditor-handler.ts (Phase B.13 webview restructuring).

  This panel uses inline on*= handlers throughout (onclick/onchange on the
  toolbar, add-form and dynamically rendered queue entries), so per migration
  guide §7 it HAND-WRITES a CSP with 'unsafe-inline' and NO nonce-source —
  under CSP L3 a nonce-source would make 'unsafe-inline' be ignored and break
  every inline handler. Because the document already declares a CSP, the loader
  leaves it untouched (it still adds harmless, ignored nonces to scripts).

  The codicons stylesheet is injected at runtime by main.js from
  window.__INIT__.codiconsUri (no placeholder exists for node_modules assets).
  Component scripts load before
  main.js so their global functions exist when main.js's init runs; they read
  main.js's host globals at call-time (classic-script shared global scope).
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} https: data:; style-src {{cspSource}} 'unsafe-inline'; font-src {{cspSource}}; script-src {{cspSource}} 'unsafe-inline';">
<link rel="stylesheet" href="{{sharedUri}}/queueEntryStyles.css">
<link rel="stylesheet" href="{{sharedUri}}/mdOverlay.css">
<link rel="stylesheet" href="{{sharedUri}}/aspectPicker.css">
</head>
<body class="queue-editor-page">
<h2>Prompt Queue</h2>
<!-- The compaction and memory-extraction models: the same keys and choices as
     the Status Page's History Compaction dropdowns (compactionPickerState).
     Shared by every run: above the tabs. -->
<div class="context-bar" id="compactionPickers" style="gap:6px;">
  <!-- Night mode (services/nightMode.ts): the window-wide chat variable night-mode; a click asks this window or every window. -->
  <button class="ctx-btn-icon night-mode-btn" id="nightModeBtn" aria-pressed="false" title="Night mode: off"><span class="codicon codicon-moon"></span></button>
  <!-- Label-less choice buttons (gsel22): the chosen model as link text; a click opens VS Code's picker (pickCompactionModel). -->
  <a href="#" class="ctx-link model-choice" id="compactionModelLink" data-pick-model="compaction"><span class="codicon codicon-fold"></span> <span class="model-choice-text"></span></a>
  <a href="#" class="ctx-link model-choice" id="memoryModelLink" data-pick-model="memory"><span class="codicon codicon-lightbulb"></span> <span class="model-choice-text"></span></a>
  <!-- The guideline picker (gsel5, media/shared/aspectPicker.js): the window's
       choices, the all-windows change; per quest default and workspace level
       (gsel22) set from the window, clear, and edit its own selection. Drawn by main.js. -->
  <span id="aspectToolbar" class="aspect-toolbar"></span>
</div>
<!-- One tab per process run (vscimpb60b): the quest's runs and any run that has
     items. Each tab is that run's queue — its items, its toolbar, its defaults row;
     the tab shows whether the run sends, waits or is paused. Rendered by main.js. -->
<div class="run-tabs" id="runTabs" role="tablist" aria-label="The process runs' queues"></div>
<!-- Everything below the run tabs scrolls; the headline, the shared models and the tabs stay in view. -->
<div class="queue-scroll" id="queueScroll">
<div class="context-bar">
  <span id="contextSummary" class="context-summary"></span>
  <button class="ctx-btn-icon" onclick="openChatVariables()" title="Chat Variables"><span class="codicon codicon-symbol-key"></span></button>
  <button class="ctx-btn-icon" onclick="openTemplateEditor()" title="Prompt Templates"><span class="codicon codicon-file-code"></span></button>
  <button class="ctx-btn-icon" onclick="openQueueTemplates()" title="Queue Templates"><span class="codicon codicon-symbol-file"></span></button>
  <button class="ctx-btn-icon" id="recentPromptsBtn" onclick="openRecentPrompts()" title="Recent Prompts: the last 100 prompts the queue sent in this quest, with their answers"><span class="codicon codicon-history"></span></button>
  <button class="ctx-btn-icon" id="makeDefaultBtn" onclick="makeRunSettingsDefault()" title="Make this run's settings the default for new runs"><span class="codicon codicon-pinned"></span></button>
</div>
<!-- The run's defaults for its items: model (the Anthropic profile), session, template. -->
<div class="context-bar" id="runDefaultsBar">
  <span id="runDefaultsSummary" class="context-summary"></span>
</div>
<div class="toolbar">
  <button class="ctx-btn-icon" onclick="toggleAddForm()" title="Add to Queue"><span class="codicon codicon-add"></span></button>
  <button class="ctx-btn-icon" id="autoSendBtn" onclick="toggleAutoSend()" title="Auto-Send"><span class="codicon codicon-play"></span></button>
  <button class="ctx-btn-icon" id="autoStartBtn" onclick="toggleAutoStart()" title="Auto-Start (enable auto-send on extension load)"><span class="codicon codicon-rocket"></span></button>
  <button class="ctx-btn-icon" id="autoPauseBtn" onclick="toggleAutoPause()" title="Auto-Pause (pause when queue empties)"><span class="codicon codicon-debug-pause"></span></button>
  <button class="ctx-btn-icon" id="autoContinueBtn" onclick="toggleAutoContinue()" title="Auto-Continue (resume repetitions after reload)"><span class="codicon codicon-sync"></span></button>
  <button class="ctx-btn-icon" id="moveItemsBtn" onclick="openMoveItemsOverlay()" title="Move items to another run: pick items of this run (with a preview of their prompts) and the run to move them to; their own profile, session, role and template are removed, so they follow that run's defaults"><span class="codicon codicon-arrow-swap"></span></button>
  <button class="ctx-btn-icon" id="applyRunDefaultsBtn" onclick="applyRunDefaultsToItems()" title="Apply the run's defaults to all items: pick which of profile, template, session and role to set on every staged and pending item, or remove the items' own settings"><span class="codicon codicon-arrow-circle-down"></span></button>
  <button class="ctx-btn-icon" onclick="restartQueue()" title="Restart Queue (reset stuck items)"><span class="codicon codicon-debug-restart"></span></button>
  <button class="ctx-btn-icon" id="stopActiveBtn" onclick="stopActiveItem()" title="Stop currently running prompt (revert to staged)"><span class="codicon codicon-debug-stop"></span></button>
  <button class="ctx-btn-icon" id="interruptForContinuationBtn" onclick="interruptActiveForContinuation()" title="Interrupt for continuation: soft first — the next tool result is held; a hard interrupt after 15 s without a hold point, or on a second click"><span class="codicon codicon-debug-disconnect"></span></button>
  <button class="ctx-btn-icon ctx-btn-double" id="sendAllStagedBtn" onclick="sendAllStaged()" title="Send all staged: make every staged item of this run pending"><span class="codicon codicon-send"></span><span class="codicon codicon-layers"></span></button>
  <button class="ctx-btn-icon ctx-btn-double" id="retryAllErrorsBtn" onclick="retryAllErrors()" title="Retry all errors: resend every item in error state — the first errored item takes the sending slot, the rest are requeued in place"><span class="codicon codicon-refresh"></span><span class="codicon codicon-error"></span></button>
  <button class="ctx-btn-icon ctx-btn-double" id="clearErrorsBtn" onclick="clearErrors()" title="Delete errors: remove every item in error state"><span class="codicon codicon-trash"></span><span class="codicon codicon-error"></span></button>
  <button class="ctx-btn-icon ctx-btn-double" id="clearSentBtn" onclick="clearSent()" title="Clear sent: remove the items that were sent"><span class="codicon codicon-trash"></span><span class="codicon codicon-check-all"></span></button>
  <button class="ctx-btn-icon ctx-btn-double" id="clearAllBtn" onclick="clearAll()" title="Clear all: remove every item of this run"><span class="codicon codicon-trash"></span><span class="codicon codicon-layers"></span></button>
  <button class="ctx-btn-icon" id="chatOnlyBtn" onclick="toggleChatOnly()" aria-pressed="false" title="From the chat panel only: show only the items queued from the @CHAT panel (its Save to Queue and Queue next buttons) and its chat sends"><span class="codicon codicon-comment-discussion"></span></button>
  <button class="ctx-btn-icon" id="collapseAllBtn" onclick="collapseAll()" title="Collapse all items"><span class="codicon codicon-collapse-all"></span></button>
  <button class="ctx-btn-icon" id="expandAllBtn" onclick="expandAll()" title="Expand all items"><span class="codicon codicon-expand-all"></span></button>
  <span id="countLabel" style="margin-left:auto; font-size:0.85em; opacity:0.7;"></span>
</div>

<div class="add-form" id="addForm">
  <label>Prompt</label>
  <textarea id="addText" data-completion="on" placeholder="Type a prompt to add to the queue..." rows="3"></textarea>
  <div class="add-options">
    <label title="The prompt template that wraps the prompt (the template store the ANTHROPIC/LLM panel's User Prompt uses).">Prompt template:</label>
    <select id="addTemplate" title="The prompt template that wraps the prompt."><option value="">(None)</option></select>
    <button class="ctx-btn-icon" onclick="addPromptTemplate()" title="Add Template"><span class="codicon codicon-add"></span></button>
    <button class="ctx-btn-icon" onclick="editPromptTemplate()" title="Edit Template"><span class="codicon codicon-edit"></span></button>
    <button class="ctx-btn-icon" onclick="deletePromptTemplate()" title="Delete Template"><span class="codicon codicon-trash"></span></button>
  </div>

  <div class="add-options">
    <span id="addRunLabel" title="The item belongs to the selected tab's run (its sessions are the run's, `<session>@<run>`)"></span>
  </div>
  <div class="add-options">
    <label style="margin-right:6px;">Queue Repeats:</label>
    <input id="addRepeatCount" type="text" value="1" style="width:80px" title="Total number of times to send this prompt (number or variable name)"/>
  </div>
  <div class="add-options">
    <label for="addProfile" style="margin-right:6px;" title="The Anthropic profile the item runs with; (default profile): the default profile of its run">Profile:</label>
    <select id="addProfile" title="The Anthropic profile the item runs with; (default profile): the default profile of its run"><option value="">(default profile)</option></select>
    <span style="font-size:11px;color:var(--vscode-notificationsWarningIcon-foreground);margin-left:6px;">⚠️ Queue runs auto-approve every tool call — the profile's approval setting is ignored.</span>
  </div>
  <div class="add-options" style="display:block;">
    <label style="display:block;margin-bottom:4px;">Repeat Prefix (supports ${repeatNumber}, ${repeatIndex}, ${repeatCount})</label>
    <textarea id="addRepeatPrefix" data-completion="on" rows="2" placeholder="Optional text added before repeated prompt body"></textarea>
    <label style="display:block;margin:6px 0 4px;">Repeat Suffix (supports ${repeatNumber}, ${repeatIndex}, ${repeatCount})</label>
    <textarea id="addRepeatSuffix" data-completion="on" rows="2" placeholder="Optional text added after repeated prompt body"></textarea>
  </div>
  <div class="add-form-actions">
    <button onclick="addPrompt()" style="background:var(--btnBg);color:var(--btnFg);">✅ Add</button>
    <button onclick="cancelAdd()">Cancel</button>
    <span id="addFeedback" class="add-feedback"></span>
  </div>
</div>

<!-- Orange banner shown while a Quest Refresh dispatch is in flight, so a
     paused/idle-looking queue reads as "intentionally busy" rather than stuck.
     Hidden by default; main.js toggles it from state.questRefreshActive. -->
<div id="questRefreshBanner" role="status" style="display:none;margin:6px 0;padding:8px 12px;border-radius:4px;background:#b5730a;color:#fff;font-size:0.9em;font-weight:600;">
  🔄 Quest refresh is running… configure in the Extension Status Page
</div>
<div class="queue-list" id="queueList"><div class="empty">Loading…</div></div>
</div>
<noscript><div class="empty" style="color:var(--vscode-errorForeground,#f85149);">JavaScript is disabled in this webview.</div></noscript>

<script src="{{sharedUri}}/mdOverlay.js"></script>
<script src="{{sharedUri}}/aspectPicker.js"></script>
<script src="{{sharedUri}}/queueEntryUtils.js"></script>
<script src="{{sharedUri}}/queueEntryRenderFunctions.js"></script>
<script src="{{sharedUri}}/queueEntryMessageHandlers.js"></script>
<script src="{{baseUri}}/main.js"></script>
<script src="{{sharedUri}}/completion.js"></script>
<script src="{{baseUri}}/fallback.js"></script>
</body>
</html>
