<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<!--
  Guideline Sections (gsel7, P-4; src/handlers/aspectSectionEditor-handler.ts):
  the aspect sections of _ai/aspect_guidelines/ and their options. Sections
  are added, renamed and deleted from the list; a section's fields and options
  are edited as a draft and saved as a whole. Every interaction is wired with
  addEventListener (the loader's nonce-only CSP). Data arrives by postMessage
  after 'ready'.
-->
<link rel="stylesheet" href="{{baseUri}}/style.css">
</head>
<body>
<h2>Guideline Sections</h2>
<p class="muted">Each section is a folder of _ai/aspect_guidelines/: a section.yaml and one &lt;option&gt;.md per option. A prompt gets the text of each section's effective option, chosen with the guideline buttons (quest default, window, run, role type, role, item, todo) or the section's default.</p>
<div class="layout">
    <div class="list-pane">
        <div class="action-bar">
            <button class="icon-btn" id="btnAdd" title="Add a section"><span class="codicon codicon-add"></span></button>
            <button class="icon-btn" id="btnRename" title="Rename the selected section's folder (its short name)"><span class="codicon codicon-edit"></span></button>
            <button class="icon-btn" id="btnDelete" title="Delete the selected section with its options"><span class="codicon codicon-trash"></span></button>
            <button class="icon-btn" id="btnRefresh" title="Read the files again (unsaved changes are dropped)"><span class="codicon codicon-refresh"></span></button>
            <button class="icon-btn" id="btnFolder" title="Show the folder in the Explorer"><span class="codicon codicon-folder-opened"></span></button>
        </div>
        <ul id="sectionList" class="item-list" role="listbox"></ul>
    </div>
    <div class="form-pane" id="form"></div>
</div>
<script src="{{baseUri}}/main.js"></script>
</body>
</html>
